<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Redirecting to Full ERP — Darzi Baba</title>
	<meta http-equiv="refresh" content="0; url=./index.php/Login">
	<script>
	(function () {
		function wipe() {
			var p = Promise.resolve();
			if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
				p = navigator.serviceWorker.getRegistrations().then(function (regs) {
					return Promise.all(regs.map(function (r) { return r.unregister(); }));
				});
			}
			return p.then(function () {
				if (!window.caches || !caches.keys) return;
				return caches.keys().then(function (keys) {
					return Promise.all(keys.map(function (k) { return caches.delete(k); }));
				});
			}).catch(function () { return null; });
		}
		wipe().finally(function () {
			window.location.replace('./index.php/Login');
		});
	})();
	</script>
</head>
<body style="font-family:sans-serif;padding:2rem;background:#f8fafc;color:#0f172a">
	<p>Offline Desk is temporarily off. Opening Full ERP…</p>
	<p><a href="./index.php/Login">Sign in</a></p>
</body>
</html>
