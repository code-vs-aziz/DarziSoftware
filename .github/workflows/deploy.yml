name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rsync to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete --exclude .git --exclude node_modules --exclude vendor-php --exclude .env --exclude website/.env.local --exclude website/.next --exclude bridge/whatsapp-bridge/.wwebjs_auth --exclude bridge/whatsapp-bridge/.wwebjs_cache --exclude desktop/node_modules --exclude erp-spa/node_modules
          path: ./
          remote_path: /var/www/darzibaba/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Install & restart services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/darzibaba
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-dev --optimize-autoloader --ignore-platform-reqs
            cd /var/www/darzibaba/bridge/whatsapp-bridge && npm install --omit=dev
            cd /var/www/darzibaba/website && npm install && npm run build
            chown -R www-data:www-data /var/www/darzibaba/application/cache /var/www/darzibaba/application/logs /var/www/darzibaba/application/sessions /var/www/darzibaba/uploads || true
            pm2 restart darzi-wa-bridge darzi-website
            echo "Deploy OK $(date -Is)"
