name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rsync to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete --exclude .git --exclude node_modules --exclude vendor-php --exclude .env --exclude website/.env.local --exclude website/.next --exclude bridge/whatsapp-bridge/.wwebjs_auth --exclude bridge/whatsapp-bridge/.wwebjs_cache --exclude desktop/node_modules --exclude erp-spa/node_modules
          path: ./
          remote_path: /var/www/darzibaba/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Install & restart services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            # Non-interactive SSH often misses nvm/composer paths from .bashrc
            export PATH="/usr/local/bin:/usr/bin:$HOME/.local/bin:$HOME/.config/composer/vendor/bin:$PATH"
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh" || true
            [ -s /root/.nvm/nvm.sh ] && . /root/.nvm/nvm.sh || true
            cd /var/www/darzibaba
            export COMPOSER_ALLOW_SUPERUSER=1
            if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --optimize-autoloader --ignore-platform-reqs
            elif [ -x /usr/local/bin/composer ]; then
              /usr/local/bin/composer install --no-dev --optimize-autoloader --ignore-platform-reqs
            else
              echo "WARN: composer not found — skipping PHP deps (code already rsynced)"
            fi
            if command -v npm >/dev/null 2>&1; then
              cd /var/www/darzibaba/bridge/whatsapp-bridge && npm install --omit=dev
              cd /var/www/darzibaba/website && npm install && npm run build
            else
              echo "WARN: npm not found — skipping bridge/website rebuild"
            fi
            mkdir -p /var/www/darzibaba/application/cache/mpdf \
              /var/www/darzibaba/uploads/orders \
              /var/www/darzibaba/uploads/orders/mpdf_tmp \
              /var/www/darzibaba/uploads/orders/pdf_thumbs \
              /var/www/darzibaba/application/logs \
              /var/www/darzibaba/application/sessions || true
            chown -R www-data:www-data /var/www/darzibaba/application/cache /var/www/darzibaba/application/logs /var/www/darzibaba/application/sessions /var/www/darzibaba/uploads || true
            chmod -R ug+rwX /var/www/darzibaba/application/cache /var/www/darzibaba/uploads/orders || true
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart darzi-wa-bridge darzi-website || true
            fi
            echo "Deploy OK $(date -Is)"
